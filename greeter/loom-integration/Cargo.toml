[package]
name = "loom-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
loom-rpc = { path = "../../gen/rs", default-features = false, features = ["map-v1", "stations-v1", "command-v1"] }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport"] }
async-stream = "0.3"
tracing = "0.1"
