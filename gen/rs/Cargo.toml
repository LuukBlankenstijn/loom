[package]
name = "loom-rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14"
prost-types = "0.14"
# Core tonic (Wasm-safe)
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
# Standalone codec for 0.14
tonic-prost = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native transport with specific 0.14 features
# We use 'tls-ring' as the standard modern TLS provider
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client = "0.8"
wasm-bindgen-futures = "0.4"

[features]
default = ["native"]
native = []
wasm = []

# @@protoc_deletion_point(features)
# This section is automatically generated by protoc-gen-prost-crate.
# Changes in this area may be lost on regeneration.
proto_full = ["admin-v1","command-v1","event-v1","map-v1","station-v1"]
"admin-v1" = []
"command-v1" = []
"event-v1" = ["command-v1"]
"map-v1" = []
"station-v1" = ["command-v1"]
## @@protoc_insertion_point(features)