[package]
name = "loom-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
loom-rpc = { path = "../gen/rs", features = ["admin-v1", "station-v1", "map-v1", "broadcast-v1"] }
loom-core = { path = "../shared/core" }
loom-proto-bridge = { path = "../shared/proto-bridge" }

tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-web = "0.14"
prost-types = "0.14"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
async-trait = "0.1"
tokio-stream = {version= "0.1", features = ['sync'] }
futures = "0.3.32"
derive_more = { version = "2.1.1", features = ["from", "constructor"] }
async-stream = "0.3.6"
bytes = "1.11.1"

[profile.dev.package.image]
opt-level = 3
