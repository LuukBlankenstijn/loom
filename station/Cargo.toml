[package]
name = "loom-station"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
loom-rpc = { path = "../gen/rs", features = ["stations-v1"]}
greeter-dbus = { path = "../shared/greeter-dbus"}
zbus = { version = "5", default-features = false, features = ["tokio"] }
tonic = "0.14.5"
sd-notify = "0.4.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-journald = "0.3.2"
tokio-stream = "0.1.18"
anyhow = "1.0.102"
