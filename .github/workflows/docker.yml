name: Build and push Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Manual tag name (e.g., v1.0.1-beta)"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_vars.outputs.tag }}
      repo_lowercase: ${{ steps.set_vars.outputs.repo_lowercase }}
    steps:
      - id: set_vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lowercase=$REPO_LOWER" >> $GITHUB_OUTPUT

  build-backend:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.repo_lowercase }}/backend:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.repo_lowercase }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-dashboard:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.repo_lowercase }}/dashboard:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prep.outputs.repo_lowercase }}/dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
