services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/loom.db
      # AUTH_TOKEN: changeme
      # DJ_BASE_URL: http://domjudge/api
      # DJ_USERNAME: admin
      # DJ_PASSWORD: secret
    ports:
      - "8080:8080"
    volumes:
      - loom_data:/data

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"

  db:
    image: postgres:17
    profiles: [migrate]
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  loom_data:
  postgres_data:
