services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: loom
      DB_DATABASE: loom
      DB_PASSWORD: loom
      DB_SSLMODE: disable
      # AUTH_TOKEN: changeme
      # DJ_BASE_URL: http://domjudge/api
      # DJ_USERNAME: admin
      # DJ_PASSWORD: secret
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  postgres_data:
