[package]
name = "loom-map-client"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.20.0", features = ["v7", "js"] }
loom-map-types = { path = "../map/types"}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
loom-rpc = { path = "../../gen/rs", features = ["map-v1"] }
tonic = { version = "0.14", default-features = false, features = [ "transport"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
loom-rpc = { path = "../../gen/rs", default-features = false, features = ["wasm", "map-v1"] }
tonic-web-wasm-client = "0.8"
