[package]
name = "loom-station-registration"
version = "0.1.0"
edition = "2024"

[lib]
name = "loom_station_registration_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
