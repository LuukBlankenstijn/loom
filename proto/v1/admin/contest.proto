syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Contest {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp start_time = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_time = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  optional int32 map_id = 5;
}

message UploadWallpaperRequest {
  string contest_id = 1;
  optional bytes image_data = 2;
}

message SetWallpaperTextColorRequest {
  string contest_id = 1;
  string color = 2 [(buf.validate.field).string.pattern = "^#?([A-Fa-f0-9]{3}|[A-Fa-f0-9]{6})$"];
}

message SetMapRequest {
  string contest_id = 1;
  int32 map_id = 2;
}

service ContestService {
  // Gets the current or next active contest
  rpc GetNextContest(google.protobuf.Empty) returns (Contest) {}
  // Sets the wallpaper for some contest
  rpc SetWallpaper(UploadWallpaperRequest) returns (google.protobuf.Empty) {}
  // Sets the color of the text displayed on a wallpaper for some contest
  rpc SetWallpaperTextColor(SetWallpaperTextColorRequest) returns (google.protobuf.Empty) {}
  // Sets the map for some contest, does not error of either does not exist
  rpc SetMap(SetMapRequest) returns (google.protobuf.Empty) {}
}
