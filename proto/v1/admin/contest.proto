syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Contest {
  string id = 1;
  string name = 2;
  optional google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  optional int32 map_id = 5;
  optional int32 wallpaper_id = 6;
}

message SetWallpaperRequest {
  string contest_id = 1;
  optional int32 wallpaper_id = 2;
}

message SetMapRequest {
  string contest_id = 1;
  int32 map_id = 2;
}

service ContestService {
  // Gets the current or next active contest
  rpc GetNextContest(google.protobuf.Empty) returns (Contest) {}
  // Assigns a library wallpaper to some contest, clearing it when wallpaper_id is absent
  rpc SetWallpaper(SetWallpaperRequest) returns (google.protobuf.Empty) {}
  // Sets the map for some contest, does not error of either does not exist
  rpc SetMap(SetMapRequest) returns (google.protobuf.Empty) {}
}
