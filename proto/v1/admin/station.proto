syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "v1/command/command.proto";

message Station {
  string ip = 2 [(buf.validate.field).string.ip = true];
  // Label shown in the dashboard: the admin override if set, otherwise the one the agent reported
  optional string label = 3;
  optional string reported_label = 4;
  bool label_overridden = 5;
}

message SetStationLabelRequest {
  string ip = 1;
  // Absent or empty clears the override so the agent-reported label is used again
  optional string label = 2;
}

message StationsResponse {
  repeated Station stations = 1;
}

message DeleteStationRequest {
  string ip = 1;
}

message AssignTeamRequest {
  repeated string ips = 1;
}

message AdminEvent {
  repeated string ips = 1;
  oneof command {
    command.v1.LoginWithCredentialsCommand login_with_credentials = 2;
    command.v1.LoginCommand login = 3;
    command.v1.LogoutCommand logout = 4;
    CustomCommand custom = 5;
    google.protobuf.Empty start_registration_tool = 6;
    google.protobuf.Empty stop_registration_tool = 7;
  }
}

message CustomCommandOutput {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string output = 2;
}

message CustomCommand {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string command = 2;
  string admin_id = 3;
}

message CommandOutputRequest {
  string admin_id = 1;
}

service StationService {
  // Gets all registered stations
  rpc GetStations(google.protobuf.Empty) returns (StationsResponse) {}
  // Delete a station
  rpc DeleteStation(DeleteStationRequest) returns (google.protobuf.Empty) {}
  // Tries to assign a team to each of the stations
  rpc AssignTeam(AssignTeamRequest) returns (google.protobuf.Empty) {}
  // Overrides the label of a station, stored lowercased
  rpc SetStationLabel(SetStationLabelRequest) returns (google.protobuf.Empty) {}
  // Sends a command to the backend that is sent to one or more stations
  rpc SendCommand(AdminEvent) returns (google.protobuf.Empty) {}
  // Stream to receive custom command outputs
  rpc CommandOutput(CommandOutputRequest) returns (stream CustomCommandOutput) {}
}
