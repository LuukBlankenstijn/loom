syntax = "proto3";

package broadcast.v1;

import "google/protobuf/empty.proto";

message StationState {
  string ip = 1;
  bool connected = 2;
  bool logged_in = 3;
}

message StationStateUpdate {
  repeated StationState state = 1;
}

message BroadcastEvent {
  oneof message {
    StationStateUpdate stations_state = 2;
  }
}

service BroadcastService {
  // Subscribes to the event broadcast
  rpc Subscribe(google.protobuf.Empty) returns (stream BroadcastEvent) {}
}
